<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ponto de Presença</title>
<style>
:root{--bg:#0d1325;--bg2:#131b33;--card:#182140;--card2:#1f2a4e;--line:#2b3963;--tx:#eef1fb;--mut:#93a0c8;--acc:#5eead4;--acc2:#38bdf8;--warn:#fbbf24;--bad:#fb7185;--ok:#4ade80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#1b2a5c 0%,var(--bg) 60%) fixed;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{max-width:560px;margin:0 auto;padding:18px 16px 70px}
header.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
header.top h1{font-size:15px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin:0}
.sync{font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mut);display:inline-block}
.sync.ok i{background:var(--ok)}.sync.err i{background:var(--warn)}
.hero{text-align:center;padding:10px 0 18px}
.clock{font-size:56px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.date{color:var(--mut);margin-top:6px;text-transform:capitalize}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.card h2{font-size:13px;margin:0 0 12px;color:var(--mut);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.live{border-color:#2f6f69;background:linear-gradient(180deg,#14403f,#12263a)}
.pill{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.08);padding:6px 12px;border-radius:99px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.timer{font-size:46px;font-weight:700;margin:14px 0 4px;font-variant-numeric:tabular-nums}
.mut{color:var(--mut);font-size:14px}
.btn{display:block;width:100%;padding:16px;border-radius:16px;font-weight:700;font-size:17px;margin-top:16px;transition:transform .08s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.5}
.btn.in{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#05222a}
.btn.out{background:linear-gradient(90deg,#fb7185,#f59e0b);color:#2b0a0f}
.btn.ghost{background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:15px;padding:12px}
.btn.sm{display:inline-block;width:auto;padding:9px 14px;font-size:14px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;gap:8px;align-items:center;padding:10px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:15px}
.chip.on{border-color:var(--acc);box-shadow:0 0 0 2px rgba(94,234,212,.25) inset}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--card2);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--mut)}
.nav{position:sticky;top:0;z-index:20;margin:0 -16px 16px;padding:8px 10px;background:rgba(13,19,37,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .in{display:flex;gap:4px;width:100%}
.nav button{flex:1;padding:8px 2px;border-radius:12px;color:var(--mut);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button b{font-size:19px;line-height:1}
.nav button.on{color:var(--acc);background:rgba(94,234,212,.1)}
.dn{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.dn .t{flex:1;text-align:center;font-weight:700;font-size:16px;text-transform:capitalize}
.dn button{width:42px;height:42px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:18px}
.dn button.today{width:auto;padding:0 12px;font-size:13px}
.tl{display:flex;flex-direction:column;gap:10px}
.ev{display:flex;gap:12px;align-items:center;background:var(--card2);border-radius:14px;padding:12px;border-left:4px solid var(--acc)}
.ev .m{flex:1;min-width:0}
.ev b{display:block}
.ev small{color:var(--mut)}
.ev a{color:var(--acc2);text-decoration:none}
.ev .d{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ev .ed{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.07)}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.ub{margin-bottom:14px}
.ub .l{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;font-size:15px}
.ub .l span:first-child{display:flex;gap:8px;align-items:center;font-weight:600}
.ub .l span:last-child{font-variant-numeric:tabular-nums}
.week{display:flex;gap:8px;align-items:flex-end;height:150px;margin-top:6px}
.wc{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.wc .stack{width:100%;display:flex;flex-direction:column-reverse;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.05);min-height:4px}
.wc small{color:var(--mut);font-size:11px;text-align:center}
.wc em{font-style:normal;font-size:11px;font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--card2);margin-bottom:8px}
.chk .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none}
.chk.y .ic{background:rgba(74,222,128,.2);color:var(--ok)}
.chk.n .ic{background:rgba(251,191,36,.2);color:var(--warn)}
.chk .m{flex:1;min-width:0}
.chk small{color:var(--mut);display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:11px;color:var(--mut);text-align:center}
.cal .c{aspect-ratio:1;border-radius:10px;background:rgba(255,255,255,.04);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--mut)}
.cal .c b{font-size:13px;color:var(--tx)}
.cal .c.e{background:transparent}
.empty{text-align:center;color:var(--mut);padding:22px 8px}
.mask{position:fixed;inset:0;background:rgba(5,8,18,.7);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:560px;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 14px}
label.f{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}
textarea{min-height:140px;font-family:ui-monospace,monospace;font-size:12px}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:#0b1020;border:1px solid var(--line);padding:12px 16px;border-radius:14px;z-index:60;max-width:90%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4);font-size:14px}
.note{font-size:13px;color:var(--mut);background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);border-radius:12px;padding:10px 12px;margin-top:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.u{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card2);border-radius:14px;margin-bottom:8px}
.u .m{flex:1;min-width:0}.u small{color:var(--mut);display:block}
</style>
</head>
<body>
<div class="app">
  <header class="top"><h1 id="ttl">Ponto de presença</h1><div class="sync" id="sync"><i></i><span>carregando…</span></div></header>
  <nav class="nav"><div class="in" id="nav"></div></nav>
  <main id="main"></main>
</div>
<div id="layer"></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var PAL=['#5eead4','#38bdf8','#a78bfa','#f472b6','#fbbf24','#fb923c','#86efac','#f87171','#67e8f9','#c4b5fd'];
var DOW=['dom','seg','ter','qua','qui','sex','sáb'];
var S={units:[],sessions:[],del:{}}, remote=null, tkRes=null;
var view='ponto', cursor=new Date(), sel=null, busy=false, store=null;
var dirty=new Set(), saving=false, ready=false;

/* ---------- utils ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return String(n).padStart(2,'0')}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function sod(d){var x=new Date(d);x.setHours(0,0,0,0);return x}
function addD(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function sow(d){var x=sod(d);var w=(x.getDay()+6)%7;return addD(x,-w)}
function som(d){var x=sod(d);x.setDate(1);return x}
function hhmm(ms){var d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes())}
function dmy(d){d=new Date(d);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()}
function dm(d){d=new Date(d);return pad(d.getDate())+'/'+pad(d.getMonth()+1)}
function fmtDur(ms){var m=Math.floor(ms/60000);var h=Math.floor(m/60);m=m%60;return h?h+'h '+pad(m)+'min':m+'min'}
function fmtHMS(ms){var s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)}
function hdec(ms){return (ms/3.6e6).toFixed(1).replace('.',',')+'h'}
function monthKey(ms){var d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function toLocalInput(ms){var d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
function longDate(d){return new Date(d).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}
function dist(a,b){var R=6371000,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r;var x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.sqrt(x))}
function fmtDist(m){return m<1000?Math.round(m)+' m':(m/1000).toFixed(1).replace('.',',')+' km'}
function mapLink(l){return 'https://www.google.com/maps?q='+l.lat+','+l.lng}

/* ---------- dados ---------- */
function unitOf(id){return S.units.find(function(u){return u.id===id})||{id:id,name:'(unidade removida)',color:'#8895bd'}}
function activeUnits(){return S.units.filter(function(u){return !u.archived})}
function activeSess(){return S.sessions.find(function(s){return s.end==null})}
function ov(s,a,b){var e=s.end==null?Date.now():s.end;return Math.max(0,Math.min(e,b)-Math.max(s.start,a))}
function sumRange(a,b,uidf){var t=0;S.sessions.forEach(function(s){if(!uidf||s.unitId===uidf)t+=ov(s,a,b)});return t}
function byUnit(a,b){
  var m={};
  S.sessions.forEach(function(s){var o=ov(s,a,b);if(o<=0)return;var r=m[s.unitId]||(m[s.unitId]={id:s.unitId,ms:0,visits:0,days:{}});r.ms+=o;r.visits++;
    for(var d=sod(Math.max(s.start,a)).getTime();d<Math.min(s.end==null?Date.now():s.end,b);d+=864e5){r.days[dmy(d)]=1}});
  return Object.keys(m).map(function(k){return m[k]}).sort(function(x,y){return y.ms-x.ms});
}
function sessionsIn(a,b){return S.sessions.filter(function(s){return ov(s,a,b)>0||(s.end==null&&s.start<b&&s.start>=a)}).sort(function(x,y){return x.start-y.start})}
function daysWorked(a,b){var n=0;for(var d=a;d<b;d+=864e5){if(sumRange(d,d+864e5)>0)n++}return n}

/* ---------- armazenamento ---------- */
function setSync(k,t){var e=$('#sync');e.className='sync '+k;e.lastChild.textContent=t}
function withTimeout(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'))},ms)})])}
async function initStore(){
  try{
    if(window.claude&&window.claude.use){
      var r=await withTimeout(Promise.all([window.claude.use('db'),window.claude.use('user')]),10000);
      var db=r[0],user=r[1];var id=user?await user.id():null;
      if(db&&id){store={col:db.collection('data/users/'+id)}}
    }
  }catch(e){store=null}
  if(!store&&!(window.claude&&window.claude.use)&&/^https?:$/.test(location.protocol)){var tk='';try{tk=localStorage.getItem('ponto_token')||''}catch(e){}remote={token:tk}}
}
function localRead(){try{var t=localStorage.getItem('ponto_v1');return t?JSON.parse(t):null}catch(e){return null}}
function localWrite(){try{localStorage.setItem('ponto_v1',JSON.stringify(S))}catch(e){}}
async function load(){
  var loaded=false;
  if(store){
    try{
      var snap=await withTimeout(store.col.get(),10000);
      var units=null,sess=[];
      snap.docs.forEach(function(d){var v=d.data()||{};if(d.id==='units'&&Array.isArray(v.list))units=v.list;else if(d.id.indexOf('m-')===0&&Array.isArray(v.sessions))sess=sess.concat(v.sessions)});
      if(units||sess.length){S={units:units||[],sessions:sess,del:{}};loaded=true}
    }catch(e){}
  }
  if(!loaded){
    var l=localRead();
    if(l&&(l.units||l.sessions)){S={units:l.units||[],sessions:l.sessions||[],del:l.del||{}};
      if(store){dirty.add('units');S.sessions.forEach(function(s){dirty.add('m-'+monthKey(s.start))})}}
  }
  if(!S.units.length){
    S.units=[{id:'u-sion',name:'Sion',color:PAL[0]},{id:'u-cidade-nova',name:'Cidade Nova',color:PAL[1]}];
    dirty.add('units');
  }
  localWrite();
  if(remote){await remoteStart()}
  else setSync(store?'ok':'err',store?'salvo na nuvem':'só neste aparelho');
  if(dirty.size)flush();
}
function mergeState(a,b){
  a=a||{};b=b||{};
  var del={};[a.del,b.del].forEach(function(x){if(x)for(var k in x)del[k]=Math.max(del[k]||0,x[k])});
  function ml(la,lb){var m={};(la||[]).concat(lb||[]).forEach(function(x){if(!x||!x.id)return;var c=m[x.id];if(!c||(x.m||0)>=(c.m||0))m[x.id]=x});return Object.keys(m).map(function(k){return m[k]})}
  var units=ml(a.units,b.units).sort(function(x,y){return x.id<y.id?-1:x.id>y.id?1:0});
  var canon={},remap={},list=[];
  units.forEach(function(u){var k=String(u.name||'').trim().toLowerCase();if(canon[k])remap[u.id]=canon[k];else{canon[k]=u.id;list.push(u)}});
  var sess=ml(a.sessions,b.sessions).filter(function(s){return !(del[s.id]&&del[s.id]>=(s.m||0))}).map(function(s){if(remap[s.unitId])s.unitId=remap[s.unitId];return s});
  return {units:list,sessions:sess,del:del};
}
async function api(method,body){
  var r=await fetch('/api/ponto',{method:method,headers:{'content-type':'application/json','x-ponto-token':remote.token},body:body?JSON.stringify(body):undefined});
  if(!r.ok){var e=new Error('http '+r.status);e.code=r.status;throw e}
  return r.json();
}
async function remoteSyncOnce(){var r=await api('GET');S=mergeState(r,S);localWrite();await api('PUT',S)}
function askToken(msg){return new Promise(function(res){tkRes=res;modal('<h3>Senha de acesso</h3><div class="mut" style="font-size:14px">'+msg+'</div><label class="f">Senha</label><input id="tk" type="password" autocomplete="current-password"><div class="acts"><button class="btn in sm" data-act="tk-ok">Entrar</button><button class="btn ghost sm" data-act="tk-skip">Usar só neste aparelho</button></div>')})}
async function remoteStart(){
  var msg='Digite a senha de acesso para sincronizar seus registros entre aparelhos.';
  for(var i=0;i<4;i++){
    if(!remote.token){var t=await askToken(msg);if(!t){remote=null;setSync('err','só neste aparelho');return}remote.token=t}
    try{await remoteSyncOnce();try{localStorage.setItem('ponto_token',remote.token)}catch(e){}setSync('ok','salvo no Netlify');return}
    catch(e){
      if(e.code===401){remote.token='';try{localStorage.removeItem('ponto_token')}catch(x){}msg='Senha incorreta. Tente de novo.';continue}
      if(e.code===500)toast('O servidor está sem a senha configurada (PONTO_TOKEN).');
      if(e.code===404||e.code===500){remote=null;setSync('err','só neste aparelho');return}
      setSync('err','sem conexão (fica neste aparelho)');return;
    }
  }
  remote=null;setSync('err','só neste aparelho');
}
var needSync=false,syncing=false;
async function remoteFlush(){
  needSync=true;if(syncing)return;syncing=true;
  try{while(needSync){needSync=false;await remoteSyncOnce()}setSync('ok','salvo no Netlify');if(ready)render()}
  catch(e){setSync('err',e.code===401?'senha inválida — recarregue':'sem conexão (fica neste aparelho)')}
  syncing=false;
}
function touch(){for(var i=0;i<arguments.length;i++)dirty.add(arguments[i]);localWrite();flush()}
async function flush(){
  if(remote&&!store)return remoteFlush();
  if(saving)return;
  if(!store){setSync('err','só neste aparelho');return}
  saving=true;
  try{
    while(dirty.size){
      var k=dirty.values().next().value;
      if(k==='units')await store.col.doc('units').set({list:S.units});
      else{var mk=k.slice(2);await store.col.doc(k).set({sessions:S.sessions.filter(function(s){return monthKey(s.start)===mk})})}
      dirty.delete(k);
    }
    setSync('ok','salvo na nuvem');
  }catch(e){setSync('err','não sincronizou (tente de novo)')}
  saving=false;
}

/* ---------- localização ---------- */
function getPos(){
  return new Promise(function(res){
    if(!navigator.geolocation)return res({err:'sem suporte a localização'});
    var done=false;var t=setTimeout(function(){if(!done){done=true;res({err:'tempo esgotado'})}},13000);
    try{
      navigator.geolocation.getCurrentPosition(function(p){if(done)return;done=true;clearTimeout(t);res({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)})},
      function(e){if(done)return;done=true;clearTimeout(t);res({err:e&&e.code===1?'permissão de localização negada':'não foi possível obter a posição'})},
      {enableHighAccuracy:true,timeout:12000,maximumAge:20000});
    }catch(e){done=true;clearTimeout(t);res({err:'localização indisponível aqui'})}
  });
}
function nearest(p){
  var best=null;activeUnits().forEach(function(u){if(u.lat==null)return;var d=dist(p,u);if(!best||d<best.d)best={u:u,d:d}});
  return best;
}

/* ---------- ações ---------- */
function toast(t){var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},3800)}
function pLoc(p){return p&&p.lat!=null?{lat:p.lat,lng:p.lng,acc:p.acc}:null}
async function closeActive(p){var a=activeSess();if(a){a.end=Date.now();a.eLoc=pLoc(p);a.m=Date.now();touch('m-'+monthKey(a.start))}}
async function doIn(unitId){
  if(busy)return;busy=true;render();
  var p=await getPos();var u=unitOf(unitId);var msg='Entrada registrada em '+u.name+' às '+hhmm(Date.now());
  var cur=activeSess();if(cur)await closeActive(p);
  if(p.lat!=null){
    if(u.lat==null){u.lat=p.lat;u.lng=p.lng;u.m=Date.now();touch('units');msg+=' · local da unidade salvo'}
    else{var d=dist(p,u);if(d>600)msg+=' · atenção: você está a '+fmtDist(d)+' do local cadastrado'}
  }else msg+=' · sem localização ('+p.err+')';
  var now=Date.now();
  S.sessions.push({id:uid(),unitId:unitId,start:now,end:null,sLoc:pLoc(p),eLoc:null,note:'',m:now});
  touch('m-'+monthKey(now));busy=false;toast(msg);render();
}
async function doOut(){
  if(busy)return;busy=true;render();
  var p=await getPos();var a=activeSess();
  if(a){var s=a.start;await closeActive(p);toast('Saída registrada às '+hhmm(Date.now())+' · '+fmtDur(Date.now()-s)+(p.err?' · sem localização':''))}
  busy=false;render();
}
async function doDetect(){
  if(busy)return;busy=true;render();
  var p=await getPos();busy=false;
  if(p.err){toast('Não consegui sua posição: '+p.err+'. Escolha a unidade manualmente.');render();return}
  var n=nearest(p);
  if(n&&n.d<=Math.max(400,p.acc||0)){sel=n.u.id;toast('Você está em '+n.u.name+' ('+fmtDist(n.d)+')')}
  else if(n){toast('Unidade mais próxima: '+n.u.name+' a '+fmtDist(n.d))}
  else toast('Nenhuma unidade tem local salvo ainda. Faça a 1ª entrada em cada uma.');
  render();
}

/* ---------- relatórios (texto) ---------- */
function unitLines(rows){return rows.map(function(r){return '• '+unitOf(r.id).name+': '+fmtDur(r.ms)+' ('+r.visits+' visita'+(r.visits>1?'s':'')+')'}).join('\n')}
function dayText(d){
  var a=sod(d).getTime(),b=a+864e5,ev=sessionsIn(a,b);
  var t='RELATÓRIO DIÁRIO — '+longDate(d)+' ('+dmy(d)+')\nTotal trabalhado: '+fmtDur(sumRange(a,b))+'\n\nRegistros:\n';
  if(!ev.length)t+='(nenhum)\n';
  ev.forEach(function(s){var st=Math.max(s.start,a),en=Math.min(s.end==null?Date.now():s.end,b);t+='• '+hhmm(st)+' → '+(s.end==null&&en<b?'em andamento':hhmm(en))+'  '+unitOf(s.unitId).name+'  ('+fmtDur(en-st)+')'+(s.sLoc?'  📍'+mapLink(s.sLoc):'')+'\n'});
  t+='\nPor unidade:\n'+(unitLines(byUnit(a,b))||'(nenhuma)');return t;
}
function weekText(d){
  var a=sow(d).getTime(),b=a+7*864e5;
  var t='RELATÓRIO SEMANAL — '+dmy(a)+' a '+dmy(b-864e5)+'\nTotal da semana: '+fmtDur(sumRange(a,b))+'\n\nPor dia:\n';
  for(var i=0;i<7;i++){var s=a+i*864e5;t+='• '+DOW[new Date(s).getDay()]+' '+dm(s)+': '+fmtDur(sumRange(s,s+864e5))+'\n'}
  var rows=byUnit(a,b);t+='\nPresença por unidade:\n';
  activeUnits().forEach(function(u){var r=rows.find(function(x){return x.id===u.id});t+='• '+u.name+': '+(r?fmtDur(r.ms)+' ('+r.visits+' visita'+(r.visits>1?'s':'')+')':'NÃO visitada')+'\n'});
  return t;
}
function monthText(d){
  var a=som(d).getTime(),e=new Date(a);e.setMonth(e.getMonth()+1);var b=e.getTime();
  var tot=sumRange(a,b),dw=daysWorked(a,b);
  var t='RELATÓRIO MENSAL — '+new Date(a).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})+'\nTotal: '+fmtDur(tot)+'\nDias trabalhados: '+dw+(dw?'\nMédia por dia: '+fmtDur(tot/dw):'')+'\n\nPor unidade:\n';
  byUnit(a,b).forEach(function(r){t+='• '+unitOf(r.id).name+': '+fmtDur(r.ms)+' ('+Math.round(r.ms/tot*100)+'%) · '+r.visits+' visitas · '+Object.keys(r.days).length+' dias\n'});
  return t;
}
function monthCSV(d){
  var a=som(d).getTime(),e=new Date(a);e.setMonth(e.getMonth()+1);var b=e.getTime();
  var rows=['data;unidade;entrada;saida;minutos;lat_entrada;lng_entrada;lat_saida;lng_saida'];
  sessionsIn(a,b).forEach(function(s){var en=s.end==null?Date.now():s.end;rows.push([dmy(s.start),unitOf(s.unitId).name,hhmm(s.start),s.end==null?'':hhmm(s.end),Math.round((en-s.start)/60000),s.sLoc?s.sLoc.lat:'',s.sLoc?s.sLoc.lng:'',s.eLoc?s.eLoc.lat:'',s.eLoc?s.eLoc.lng:''].join(';'))});
  return rows.join('\n');
}

var TITLES={ponto:'Ponto de presença',dia:'Relatório diário',semana:'Relatório semanal',mes:'Relatório mensal',unid:'Unidades'};

/* ---------- eventos ---------- */
document.addEventListener('click',async function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  var act=el.dataset.act,id=el.dataset.id;
  if(act==='maskclose'){if(ev.target===el&&!tkRes)closeModal();return}
  if(act==='tk-ok'){var v=($('#tk')||{}).value||'';if(!v.trim())return;var f1=tkRes;tkRes=null;closeModal();if(f1)f1(v.trim());return}
  if(act==='tk-skip'){var f2=tkRes;tkRes=null;closeModal();if(f2)f2(null);return}
  if(act==='tk-reset'){try{localStorage.removeItem('ponto_token')}catch(e){}location.reload();return}
  if(act==='close'){closeModal();return}
  if(act==='tab'){view=id;cursor=new Date();render();window.scrollTo(0,0);return}
  if(act==='pick'){sel=id;render();return}
  if(act==='in'){if(sel)doIn(sel);return}
  if(act==='switch'){doIn(id);return}
  if(act==='out'){doOut();return}
  if(act==='detect'){doDetect();return}
  if(act==='prev'||act==='next'){var k=act==='next'?1:-1;
    if(view==='dia')cursor=addD(cursor,k);else if(view==='semana')cursor=addD(cursor,7*k);else{var c=new Date(cursor);c.setDate(1);c.setMonth(c.getMonth()+k);cursor=c}
    render();return}
  if(act==='now'){cursor=new Date();render();return}
  if(act==='copy-day'){copyText(dayText(cursor));return}
  if(act==='copy-week'){copyText(weekText(cursor));return}
  if(act==='copy-month'){copyText(monthText(cursor));return}
  if(act==='copy-csv'){copyText(monthCSV(cursor));return}
  if(act==='add'){sessForm(null);return}
  if(act==='edit'){sessForm(S.sessions.find(function(s){return s.id===id}));return}
  if(act==='ssave'){
    var st=new Date($('#f_s').value).getTime(),ev2=$('#f_e').value,en=ev2?new Date(ev2).getTime():null,un=$('#f_u').value;
    if(isNaN(st)){toast('Informe a entrada.');return}
    var s=id?S.sessions.find(function(x){return x.id===id}):null;
    if(en==null&&!(s&&s.end==null)){toast('Informe a saída.');return}
    if(en!=null&&en<=st){toast('A saída precisa ser depois da entrada.');return}
    if(en==null&&activeSess()&&(!s||activeSess().id!==s.id)){toast('Já existe um registro em andamento.');return}
    if(s){var old=monthKey(s.start);s.start=st;s.end=en;s.unitId=un;s.m=Date.now();touch('m-'+old,'m-'+monthKey(st))}
    else{S.sessions.push({id:uid(),unitId:un,start:st,end:en,sLoc:null,eLoc:null,note:'manual',m:Date.now()});touch('m-'+monthKey(st))}
    closeModal();render();toast('Registro salvo.');return}
  if(act==='sdel'){var i=S.sessions.findIndex(function(x){return x.id===id});if(i>=0){var m=monthKey(S.sessions[i].start),did=S.sessions[i].id;S.sessions.splice(i,1);S.del=S.del||{};S.del[did]=Date.now();touch('m-'+m)}closeModal();render();toast('Registro excluído.');return}
  if(act==='bk-export'){
    var txt=JSON.stringify({v:1,exportado:new Date().toISOString(),units:S.units,sessions:S.sessions});
    try{var bl=new Blob([txt],{type:'application/json'}),url=URL.createObjectURL(bl),lk=document.createElement('a');lk.href=url;lk.download='ponto-backup-'+toLocalInput(Date.now()).slice(0,10)+'.json';document.body.appendChild(lk);lk.click();lk.remove();setTimeout(function(){URL.revokeObjectURL(url)},2000);toast('Backup gerado.')}
    catch(e){copyText(txt)}
    return}
  if(act==='bk-import'){var f=$('#bkfile');if(f)f.click();return}
  if(act==='uadd'){unitForm(null);return}
  if(act==='uedit'){unitForm(S.units.find(function(u){return u.id===id}));return}
  if(act==='usave'){
    var nm=$('#u_n').value.trim();if(!nm){toast('Dê um nome à unidade.');return}
    var u=id?S.units.find(function(x){return x.id===id}):null;
    if(u){u.name=nm;u.m=Date.now()}else{u={id:uid(),name:nm,color:PAL[S.units.length%PAL.length],m:Date.now()};S.units.push(u);
      var cb=$('#u_loc');if(cb&&cb.checked){var p=await getPos();if(p.lat!=null){u.lat=p.lat;u.lng=p.lng}else toast('Sem localização: '+p.err)}}
    touch('units');closeModal();render();return}
  if(act==='uloc'){var p2=await getPos();var u2=S.units.find(function(x){return x.id===id});if(p2.lat!=null&&u2){u2.lat=p2.lat;u2.lng=p2.lng;u2.m=Date.now();touch('units');toast('Local da unidade atualizado.');closeModal();render()}else toast('Sem localização: '+(p2.err||''));return}
  if(act==='uarch'){var u3=S.units.find(function(x){return x.id===id});if(u3){u3.archived=!u3.archived;u3.m=Date.now();touch('units')}closeModal();render();return}
});

document.addEventListener('change',function(ev){
  if(!ev.target||ev.target.id!=='bkfile')return;
  var f=ev.target.files&&ev.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.units)||!Array.isArray(d.sessions))throw new Error('formato');
      var ids={};S.sessions.forEach(function(s){ids[s.id]=1});
      var add=d.sessions.filter(function(s){return s&&s.id&&!ids[s.id]&&typeof s.start==='number'});
      var uids={};S.units.forEach(function(u){uids[u.id]=1});
      d.units.forEach(function(u){if(u&&u.id&&!uids[u.id])S.units.push(u)});
      S.sessions=S.sessions.concat(add);
      var keys=['units'];add.forEach(function(s){keys.push('m-'+monthKey(s.start))});
      touch.apply(null,keys);render();toast(add.length+' registro(s) importado(s).');
    }catch(e){toast('Arquivo de backup inválido.')}
  };
  r.readAsText(f);
});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&remote&&ready)remoteFlush()});
setInterval(tick,1000);
(async function(){
  $('#main').innerHTML='<div class="empty">Carregando…</div>';
  await initStore();await load();ready=true;
  var a=activeSess();if(a)sel=a.unitId;
  render();
})();
})();
</script>
